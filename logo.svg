<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: Form flowing into funnel/sink -->
  <g>
    <!-- Document/Form shape -->
    <rect x="4" y="6" width="20" height="26" rx="2" fill="#4a6fa5" stroke="#3d5a80" stroke-width="1.5"/>
    <!-- Form lines -->
    <line x1="8" y1="12" x2="20" y2="12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="18" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="24" x2="16" y2="24" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

    <!-- Funnel/Sink -->
    <path d="M28 10 L44 10 L40 24 L32 24 Z" fill="#1a1a2e" stroke="#4a6fa5" stroke-width="1.5"/>
    <!-- Pipe coming out of funnel -->
    <rect x="34" y="24" width="4" height="14" fill="#1a1a2e" stroke="#4a6fa5" stroke-width="1.5"/>
    <!-- Drop coming out -->
    <circle cx="36" cy="44" r="3" fill="#4a6fa5"/>

    <!-- Arrow flowing into funnel -->
    <path d="M22 16 L28 16" stroke="#4a6fa5" stroke-width="2" stroke-linecap="round"/>
    <path d="M26 13 L29 16 L26 19" stroke="#4a6fa5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Text: FormSink -->
  <text x="54" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#e8e8e8">
    <tspan fill="#e8e8e8">Form</tspan><tspan fill="#4a6fa5">Sink</tspan>
  </text>
</svg>
