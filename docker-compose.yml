services:
  formsink:
    build: .
    container_name: formsink
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - formsink-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_KEY=${API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - TURNSTILE_REQUIRED_FORMS=${TURNSTILE_REQUIRED_FORMS:-contact,request-demo}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-credflare.net,www.credflare.net}
      - NOTIFICATION_COPY_TO=${NOTIFICATION_COPY_TO:-folks@whilesmart.com}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  formsink-data:
